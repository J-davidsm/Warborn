name: Web release QA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  embedded:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, msedge, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build:web
      - run: npm install --prefix /tmp/browser-qa playwright@1.64.1 --no-audit --no-fund
      - run: /tmp/browser-qa/node_modules/.bin/playwright install --with-deps ${{ matrix.browser }}
      - run: |
          python3 -m http.server 8878 --bind 127.0.0.1 --directory dist/web > /tmp/web-server.log 2>&1 &
          PLAYWRIGHT_MODULE=/tmp/browser-qa/node_modules/playwright node scripts/test-web-release.cjs ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: embedded-${{ matrix.browser }}
          path: release/
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run build:web
      - run: cd dist/web && zip -r ../Acadania-web.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: Acadania-web-release
          path: |
            dist/Acadania-web.zip
            dist/web-manifest.json
